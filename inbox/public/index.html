<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Growth Inbox</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:,">
</head>
<body>
<header class="bar">
  <h1>Growth Inbox</h1>
  <nav id="tabs" class="tabs" hidden>
    <button data-tab="pending" class="on">To decide <span id="n-pending"></span></button>
    <button data-tab="approved">To post <span id="n-approved"></span></button>
    <button data-tab="history">History</button>
    <button data-tab="brief">Brief</button>
    <button data-tab="numbers">Numbers</button>
    <button data-tab="settings">Settings</button>
  </nav>
</header>
<main id="main">
  <form id="login" class="login" autocomplete="off">
    <label for="pw">Passphrase</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit" class="primary">Enter</button>
    <p id="login-err" class="err" hidden></p>
  </form>
  <section id="view" hidden></section>
</main>
<script src="/app.js"></script>
</body>
</html>
